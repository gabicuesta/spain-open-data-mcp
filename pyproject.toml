[project]
name = "spain-open-data-mcp"
version = "0.1.0"
description = "MCP server that gives AI agents access to Spanish public data: INE statistics, the BOE and the Catastro."
readme = "README.md"
license = "MIT"
authors = [{ name = "Gabriel Cuesta" }]
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "ai-agents", "open-data", "spain", "ine", "boe", "catastro"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.28.1,<1",
  "pydantic>=2.14.1,<3",
  "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0", "ruff>=0.17.0"]

[project.scripts]
spain-open-data-mcp = "spain_open_data_mcp.server:main"

[project.urls]
Homepage = "https://github.com/gabicuesta/spain-open-data-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spain_open_data_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: hits the real public APIs (run with: pytest -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
